name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q --html=reports/pytest.html --self-contained-html

      - name: Generate analysis report
        run: |
          python scripts/gen_sample_data.py
          python scripts/run_analysis.py

      - name: LLM evals (mock model)
        run: |
          python llm_evals/run_evals.py --repeats 1

      - name: Smoke load test (5 VU / 5s)
        run: |
          python perf/run_load_test.py --users 5 --duration 5 --ramp 2

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: reports/pytest.html

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report-py${{ matrix.python-version }}
          path: |
            reports/report.md
            reports/*.png
            reports/perf_report.md
            reports/llm_eval_report.md
            reports/llm_pass_rate.png
