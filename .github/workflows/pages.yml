name: Publish Dashboard

# 每次推送到 main 或手动触发时：
#   1. 跑一遍全部测试与评测（产出真实数据）
#   2. 生成单文件看板
#   3. 发布到 GitHub Pages
# 启用方式：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (produce junit.xml)
        run: |
          mkdir -p reports/raw
          pytest -q --junitxml=reports/raw/junit.xml

      - name: Analysis report
        run: |
          python scripts/gen_sample_data.py
          python scripts/run_analysis.py

      - name: LLM evals (mock model)
        run: |
          python llm_evals/run_evals.py --repeats 1

      - name: Load test (small, for dashboard data)
        run: |
          python perf/run_load_test.py --users 10 --duration 8 --ramp 3

      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py
          mkdir -p _site
          cp reports/dashboard.html _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
