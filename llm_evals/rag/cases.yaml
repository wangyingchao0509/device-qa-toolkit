version: rag-20261118
# RAG 诊断用例：ground_truth 用于算 Context Recall（Ragas 的硬性要求）
# key_points 是给"离线可解释指标"用的：把标准答案拆成可核对的要点
cases:
  - id: RAG-01
    question: 买了两周还能退货吗
    ground_truth: 支持 7 天无理由退货，超过 7 天需与客服协商，且需不影响二次销售。
    key_points: ["7 天", "不影响二次销售"]
    expected_doc: D1

  - id: RAG-02
    question: 退款多久到账
    ground_truth: 审核通过后 1-3 个工作日原路退回，信用卡可能延长至 7 个工作日。
    key_points: ["1-3 个工作日", "7 个工作日"]
    expected_doc: D2

  - id: RAG-03
    question: 保修多久
    ground_truth: 整机保修 12 个月，自签收之日起计算。
    key_points: ["12 个月"]
    expected_doc: D3

  - id: RAG-04
    question: 屏幕碎了能保修吗
    ground_truth: 屏幕破损属于人为损坏，不在保修范围。
    key_points: ["人为损坏", "不在保修范围"]
    expected_doc: D3

  - id: RAG-05
    question: 充电时发烫怎么办
    ground_truth: 轻微发热正常，明显发烫应立即停止充电。
    key_points: ["停止充电", "发烫"]
    expected_doc: D4

  - id: RAG-06
    question: 为什么充到 80% 就不充了
    ground_truth: 这是电池保护策略，长期插电会限制充电上限至 80%。
    key_points: ["电池保护", "80%"]
    expected_doc: D4

  - id: RAG-07
    question: 能戴着游泳吗
    ground_truth: 支持 5ATM 防水，可用于游泳，但不建议热水浴、桑拿、潜水。
    key_points: ["5ATM", "游泳"]
    expected_doc: D5

  - id: RAG-08
    question: 心率数据会上传吗
    ground_truth: 健康数据本地加密存储，仅在授权后同步，传输全程加密。
    key_points: ["加密", "授权"]
    expected_doc: D6

  - id: RAG-09
    question: 怎么删除健康数据
    ground_truth: 在 App 设置-隐私中逐项删除，删除后不可恢复。
    key_points: ["设置", "删除"]
    expected_doc: D6

  - id: RAG-10
    question: 多久能发货
    ground_truth: 默认顺丰 48 小时内发出，偏远地区延迟 1-2 天。
    key_points: ["48 小时", "顺丰"]
    expected_doc: D7

  - id: RAG-11
    question: 保修期能延长吗
    ground_truth: 整机保修 12 个月；资料中没有关于延长保修的政策，不应承诺延长。
    key_points: ["12 个月"]
    expected_doc: D3
    note: 故意注入幻觉，用于演示生成侧定责

  - id: RAG-12
    question: 洗澡的时候能戴吗
    ground_truth: 支持 5ATM 防水，可用于游泳；进水损坏需检测判断是否在保修范围。
    key_points: ["防水", "5ATM"]
    expected_doc: D5
    note: 口语化改写导致字面检索召回不足，用于演示检索侧定责
